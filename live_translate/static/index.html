<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muối Từ · Phiên Dịch AI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="theme-color" content="#047857">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --ink: #1b1f2a; --muted: #6b7385;
    --line: #e3e6ee; --accent: #047857; --accent-ink: #fff; --a: #2563eb; --b: #c2410c;
    --interim: #9aa1b2; --danger: #d92d20; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --panel:#171b23; --ink:#e8ebf2; --muted:#9097a8; --line:#272d39;
      --accent:#34d399; --accent-ink:#052e24; --a:#60a5fa; --b:#fb923c; --interim:#6b7385; --shadow:none; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; letter-spacing:.2px; }
  header h1 span { color:var(--accent); }
  .status { margin-left:auto; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.live { background:var(--danger); animation:pulse 1.2s infinite; }
  .dot.ok { background:var(--accent); }
  @keyframes pulse { 50% { opacity:.3; } }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns: 300px 1fr; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  select, textarea, input[type=text] { width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  textarea { resize:vertical; min-height:70px; }
  .row { display:flex; gap:8px; align-items:end; }
  .row > div { flex:1; min-width:0; }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.big { width:100%; padding:14px; font-size:16px; font-weight:600; border-radius:12px; margin-top:12px; }
  button.rec { background:var(--danger); border-color:var(--danger); color:#fff; }
  .seg { display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:10px; border:1px solid var(--line); }
  .seg button { flex:1; border:none; background:transparent; padding:7px 4px; font-size:13px; }
  .seg button.on { background:var(--panel); box-shadow:var(--shadow); color:var(--accent); font-weight:600; }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; color:var(--ink); }
  .check input { width:16px; height:16px; }
  .talk { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .talk button { padding:16px 8px; font-weight:600; border-radius:12px; }
  .talk .ta { border-color:var(--a); color:var(--a); }
  .talk .tb { border-color:var(--b); color:var(--b); }
  .talk button.rec { color:#fff; }
  #feed { display:flex; flex-direction:column; gap:10px; min-height:360px; max-height:calc(100vh - 190px); overflow:auto; padding-right:4px; }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--bg); position:relative; }
  .card.A { border-left:4px solid var(--a); } .card.B { border-left:4px solid var(--b); }
  .card .meta { font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .card .src { margin-top:4px; color:var(--muted); }
  .card .tgt { margin-top:4px; font-size:18px; font-weight:500; white-space:pre-wrap; }
  .card .tgt.err { color:var(--danger); font-size:14px; }
  .card .acts { margin-left:auto; display:flex; gap:4px; }
  .card .acts button { padding:2px 8px; font-size:12px; }
  .card .explain { margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--panel); border:1px dashed var(--line); font-size:14px; white-space:pre-wrap; }
  @media (max-width: 600px) {
    header { padding:10px 16px; }
    header h1 { font-size:16px; white-space:nowrap; }
    #statusText { display:none; }
    main { padding:12px; gap:12px; }
    .panel { padding:12px; }
    .toolbar strong.grow { flex:1 1 100%; }
    .toolbar button { flex:1; padding:7px 6px; font-size:13px; }
    .card .meta { flex-wrap:wrap; }
    .card .acts { margin-left:0; width:100%; justify-content:flex-end; }
    #feed { max-height:none; min-height:200px; }
  }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
  .toast.on { opacity:.95; }
  .interim { color:var(--interim); font-style:italic; min-height:24px; padding:6px 2px; }
  .caret::after { content:"▍"; animation:pulse 1s infinite; color:var(--accent); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  .toolbar .grow { flex:1; }
  .text-in { display:flex; gap:8px; margin-top:10px; }
  .text-in textarea { min-height:48px; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .warn { background:#fff4e5; color:#8a4b00; border:1px solid #f5c27a; padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:10px; display:none; }
  @media (prefers-color-scheme: dark) { .warn { background:#2a1f10; color:#f5c27a; border-color:#6b4a14; } }
  .seg { flex-wrap:wrap; }
  .seg button { flex:1 1 30%; }
  /* video assistant */
  .cam { position:relative; margin-top:12px; border-radius:12px; overflow:hidden; background:#000; width:100%; height:min(56vh, 120vw); }
  .cam .cam-answer { position:absolute; left:0; right:0; bottom:0; max-height:45%; overflow:auto; background:linear-gradient(transparent, rgba(0,0,0,.82) 18%); color:#fff; font-size:17px; line-height:1.45; padding:22px 14px 12px; display:none; white-space:pre-wrap; }
  .cam .cam-answer .cam-q { color:#cbd5e1; font-size:13px; margin-bottom:4px; }
  .cam video, .cam #still { width:100%; height:100%; object-fit:cover; display:block; }
  .cam #still { object-fit:contain; background:#000; }
  .cam .cam-off { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#9aa1b2; font-size:14px; text-align:center; padding:16px; }
  .cam .cam-state { position:absolute; left:10px; top:10px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:4px 8px; border-radius:8px; display:none; }
  .cam-row { display:flex; gap:8px; margin-top:8px; }
  .cam-row button { flex:1; }
  .card .thumb { width:96px; height:72px; object-fit:cover; border-radius:8px; float:right; margin:0 0 6px 10px; }
  .card::after { content:""; display:block; clear:both; }
  /* caption (subtitle) mode */
  #caption { position:fixed; inset:0; background:#000; color:#fff; display:none; flex-direction:column; justify-content:flex-end; padding:5vh 6vw; z-index:20; }
  #caption.on { display:flex; }
  #caption .c-src { color:#9aa1b2; font-size:3.2vh; margin-bottom:1.5vh; }
  #caption .c-tgt { font-size:var(--cap, 6vh); font-weight:600; line-height:1.3; }
  #caption .c-close { position:absolute; top:16px; right:16px; background:#222; color:#fff; border-color:#444; }
  #caption .c-size { position:absolute; top:16px; left:16px; display:flex; gap:6px; }
  #caption .c-size button { background:#222; color:#fff; border-color:#444; }
</style>
</head>
<body>
<header>
  <h1><span>Muối Từ</span> · Phiên Dịch AI</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">檢查伺服器…</span></div>
</header>

<main>
  <section class="panel" id="controls">
    <div id="inviteBox">
      <h2>邀請碼</h2>
      <div class="row" style="align-items:center">
        <div><input type="text" id="invite" placeholder="MT-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
        <button id="inviteSave">確認</button>
      </div>
      <div class="hint" id="inviteStatus"></div>
    </div>
    <h2 style="margin-top:14px">模式</h2>
    <div class="seg" id="modeSeg">
      <button data-mode="speech" class="on">🎙 演講字幕</button>
      <button data-mode="convo">💬 雙人對話</button>
      <button data-mode="text">⌨️ 文字</button>
      <button data-mode="compose">✍️ 社群</button>
      <button data-mode="vision">📹 視訊助手</button>
    </div>

    <div class="row" style="margin-top:6px">
      <div>
        <label for="srcLang" id="srcLabel">來源語言</label>
        <select id="srcLang"></select>
      </div>
      <button id="swap" title="交換語言" style="margin-bottom:1px">⇄</button>
      <div>
        <label for="tgtLang" id="tgtLabel">目標語言</label>
        <select id="tgtLang"></select>
      </div>
    </div>

    <label for="style" id="styleLabel">翻譯風格</label>
    <select id="style">
      <option value="natural">自然（忠實原意）</option>
      <option value="casual">輕鬆口語（像跟朋友聊天）</option>
      <option value="social">社群道地（網路用語 / 流行語）</option>
      <option value="formal">正式禮貌</option>
      <option value="business">商務專業</option>
    </select>

    <div id="speechCtl">
      <button class="big primary" id="micBtn">● 開始聆聽</button>
    </div>
    <div id="convoCtl" style="display:none">
      <div class="talk">
        <button class="ta" id="talkA">A 說話</button>
        <button class="tb" id="talkB">B 說話</button>
      </div>
      <div class="hint">按一下開始，再按一下結束。A 使用來源語言，B 使用目標語言，翻譯互相對調。</div>
    </div>
    <div id="visionCtl" style="display:none">
      <div class="cam">
        <video id="cam" playsinline muted autoplay></video>
        <img id="still" alt="上傳的圖片" style="display:none">
        <div class="cam-off" id="camOff">按下「開啟鏡頭」，把鏡頭對準要問的東西</div>
        <div class="cam-state" id="camState"></div>
        <div class="cam-answer" id="camAnswer"><div class="cam-q" id="camQ"></div><div id="camA"></div></div>
      </div>
      <div class="cam-row">
        <button id="camBtn">📷 開啟鏡頭</button>
        <button id="camFlip" title="切換前後鏡頭">🔄 前 / 後</button>
        <button id="uploadBtn" title="從相簿選圖片或拍照">🖼 上傳圖片</button>
      </div>
      <input type="file" id="imgFile" accept="image/*" hidden>
      <button class="big primary" id="askBtn">🎙 按一下，開口問</button>
      <button id="lookBtn" style="width:100%;margin-top:8px">👀 看一下畫面（不用說話）</button>
      <label class="check"><input type="checkbox" id="voiceReply" checked> 🔊 每次回答都用語音唸出來</label>
      <div class="hint">AI 會看鏡頭畫面（或你上傳的圖片）＋聽你的問題，用「我的語言」回答並唸出來。也可以在輸入框打字問。上傳圖片後可以繼續針對同一張圖追問；按「開啟鏡頭」回到即時畫面。</div>
    </div>

    <label class="check"><input type="checkbox" id="tts"> 自動朗讀翻譯 (TTS)</label>
    <label class="check"><input type="checkbox" id="showSrc" checked> 顯示原文</label>

    <label for="glossary">專有名詞表（選填，一行一條：原文 = 譯文）</label>
    <textarea id="glossary" placeholder="TrendRadar = TrendRadar&#10;招標 = tender"></textarea>
    <button id="installBtn" style="display:none;width:100%;margin-top:12px">📲 安裝到手機 / 桌面</button>
    <div class="hint">語音辨識使用瀏覽器內建 Web Speech API（建議 Chrome / Edge / Safari）。翻譯由 Claude 串流生成。</div>
  </section>

  <section class="panel">
    <div class="warn" id="warn"></div>
    <div class="toolbar">
      <strong class="grow">即時逐字稿</strong>
      <button id="captionBtn">🖥 全螢幕字幕</button>
      <button id="exportTxt">⬇ TXT</button>
      <button id="exportSrt">⬇ SRT</button>
      <button id="clearBtn">清除</button>
    </div>
    <div class="interim" id="interim"></div>
    <div id="feed"><div class="empty" id="empty">按「開始聆聽」並說話，翻譯會即時出現在這裡（最新的在最上面）。</div></div>
    <div class="text-in" id="textCtl" style="display:none">
      <textarea id="textIn" placeholder="輸入要翻譯的文字，Enter 送出（Shift+Enter 換行）"></textarea>
      <button class="primary" id="sendText">翻譯</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<div id="caption">
  <div class="c-size"><button id="capMinus">A−</button><button id="capPlus">A+</button></div>
  <button class="c-close" id="capClose">✕ 關閉 (Esc)</button>
  <div class="c-src" id="capSrc"></div>
  <div class="c-tgt" id="capTgt">等待語音…</div>
</div>

<script>
// ---------- Languages: [speech-recognition BCP-47, display name, name sent to the model] ----------
const LANGS = [
  ["zh-TW","繁體中文（台灣）","Traditional Chinese (Taiwan)"],
  ["zh-HK","粵語（香港）","Cantonese / Traditional Chinese (Hong Kong)"],
  ["zh-CN","简体中文","Simplified Chinese"],
  ["en-US","English (US)","American English"],
  ["en-GB","English (UK)","British English"],
  ["vi-VN","Tiếng Việt","Vietnamese"],
  ["ja-JP","日本語","Japanese"],
  ["ko-KR","한국어","Korean"],
  ["th-TH","ไทย","Thai"],
  ["id-ID","Bahasa Indonesia","Indonesian"],
  ["ms-MY","Bahasa Melayu","Malay"],
  ["fil-PH","Filipino","Filipino"],
  ["km-KH","ខ្មែរ","Khmer"],
  ["lo-LA","ລາວ","Lao"],
  ["my-MM","မြန်မာ","Burmese"],
  ["hi-IN","हिन्दी","Hindi"],
  ["bn-BD","বাংলা","Bengali"],
  ["ur-PK","اردو","Urdu"],
  ["ta-IN","தமிழ்","Tamil"],
  ["ne-NP","नेपाली","Nepali"],
  ["fr-FR","Français","French"],
  ["de-DE","Deutsch","German"],
  ["es-ES","Español (España)","Spanish (Spain)"],
  ["es-MX","Español (México)","Mexican Spanish"],
  ["pt-BR","Português (BR)","Brazilian Portuguese"],
  ["pt-PT","Português (PT)","European Portuguese"],
  ["it-IT","Italiano","Italian"],
  ["nl-NL","Nederlands","Dutch"],
  ["sv-SE","Svenska","Swedish"],
  ["nb-NO","Norsk","Norwegian"],
  ["da-DK","Dansk","Danish"],
  ["fi-FI","Suomi","Finnish"],
  ["pl-PL","Polski","Polish"],
  ["cs-CZ","Čeština","Czech"],
  ["sk-SK","Slovenčina","Slovak"],
  ["hu-HU","Magyar","Hungarian"],
  ["ro-RO","Română","Romanian"],
  ["bg-BG","Български","Bulgarian"],
  ["el-GR","Ελληνικά","Greek"],
  ["uk-UA","Українська","Ukrainian"],
  ["ru-RU","Русский","Russian"],
  ["tr-TR","Türkçe","Turkish"],
  ["ar-SA","العربية","Arabic"],
  ["he-IL","עברית","Hebrew"],
  ["fa-IR","فارسی","Persian"],
  ["sw-KE","Kiswahili","Swahili"],
  ["af-ZA","Afrikaans","Afrikaans"],
  ["zu-ZA","isiZulu","Zulu"],
  ["am-ET","አማርኛ","Amharic"],
  ["wo-SN","Wolof","Wolof"],
];
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("ll_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ll_" + k, JSON.stringify(v)); } catch {} },
};
const langName = (code) => (LANGS.find(l => l[0] === code) || [code, code, code])[2];
const langLabel = (code) => (LANGS.find(l => l[0] === code) || [code, code])[1];

for (const sel of [$("srcLang"), $("tgtLang")]) {
  for (const [code, label] of LANGS) sel.add(new Option(label, code));
}
$("srcLang").value = store.get("src", "zh-TW");
$("tgtLang").value = store.get("tgt", "en-US");
$("tts").checked = store.get("tts", false);
$("showSrc").checked = store.get("showSrc", true);
$("glossary").value = store.get("glossary", "");
$("style").value = store.get("style", "natural");
$("style").onchange = () => store.set("style", $("style").value);
for (const id of ["srcLang","tgtLang"]) $(id).onchange = () => { store.set(id === "srcLang" ? "src" : "tgt", $(id).value); updateTalkLabels(); restartIfListening(); };
$("tts").onchange = () => store.set("tts", $("tts").checked);
$("showSrc").onchange = () => { store.set("showSrc", $("showSrc").checked); document.querySelectorAll(".card .src").forEach(e => e.style.display = $("showSrc").checked ? "" : "none"); };
$("glossary").oninput = () => store.set("glossary", $("glossary").value);
$("swap").onclick = () => { const s = $("srcLang").value; $("srcLang").value = $("tgtLang").value; $("tgtLang").value = s; $("srcLang").onchange(); store.set("tgt", $("tgtLang").value); };

// ---------- Invite code + server health ----------
const inviteCode = () => ($("invite").value || "").trim().toUpperCase();
$("invite").value = store.get("invite", "");
function checkServer() {
  return fetch("/api/health", { headers: { "X-Invite-Code": inviteCode() } }).then(r => r.json()).then(h => {
    $("warn").style.display = "none";
    const inviteOk = !h.invite_required || h.invite === "ok";
    $("dot").className = "dot " + (h.credentials && inviteOk ? "ok" : "");
    $("statusText").textContent = !h.credentials ? "伺服器缺少 ANTHROPIC_API_KEY" : inviteOk ? "已連線 · " + h.model : "需要邀請碼";
    if (!h.credentials) showWarn("伺服器未設定 ANTHROPIC_API_KEY，翻譯會失敗。請在啟動前設定環境變數。");
    $("inviteBox").style.display = h.invite_required ? "" : "none";
    if (!h.invite_required) return;
    const st = $("inviteStatus");
    if (h.invite === "ok") {
      st.style.color = "var(--accent)";
      st.textContent = `✓ ${h.invite_name}，歡迎使用` + (h.daily_limit ? `（今天已用 ${h.used_today} / ${h.daily_limit} 次）` : "");
    } else {
      st.style.color = "var(--danger)";
      st.textContent = h.invite_message || "請輸入邀請碼";
      if (h.invite !== "missing") showWarn(h.invite_message);
    }
  }).catch(() => { $("statusText").textContent = "無法連線伺服器"; });
}
$("inviteSave").onclick = () => { $("invite").value = inviteCode(); store.set("invite", inviteCode()); checkServer(); };
$("invite").onkeydown = (e) => { if (e.key === "Enter") $("inviteSave").onclick(); };
checkServer();

function showWarn(msg) { $("warn").textContent = msg; $("warn").style.display = "block"; }

// ---------- Mode ----------
let mode = store.get("mode", "speech");
function setMode(m) {
  if (mode === "vision" && m !== "vision") { stopCamera(); stopAsk(); }
  mode = m; store.set("mode", m); stopListening();
  const vis = m === "vision";
  $("visionCtl").style.display = vis ? "" : "none";
  $("tgtLang").parentElement.style.display = vis ? "none" : "";
  $("swap").style.display = vis ? "none" : "";
  $("style").style.display = $("styleLabel").style.display = vis ? "none" : "";
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("speechCtl").style.display = m === "speech" ? "" : "none";
  $("convoCtl").style.display = m === "convo" ? "" : "none";
  $("textCtl").style.display = (m === "text" || m === "compose" || vis) ? "flex" : "none";
  $("textIn").placeholder = m === "compose"
    ? "用你的語言寫訊息 / 貼文，翻譯後自動複製，直接貼到 IG、TikTok、WhatsApp、Discord…"
    : vis ? "打字問 AI（會連同目前鏡頭畫面一起送出）"
    : "輸入要翻譯的文字，Enter 送出（Shift+Enter 換行）";
  $("sendText").textContent = vis ? "問" : "翻譯";
  $("srcLabel").textContent = m === "convo" ? "A 的語言" : vis ? "我的語言（AI 用這個回答）" : "來源語言";
  $("tgtLabel").textContent = m === "convo" ? "B 的語言" : "目標語言";
  updateTalkLabels();
}
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
function updateTalkLabels() {
  $("talkA").textContent = (activeSpeaker === "A" ? "■ 停止 · " : "🎙 A · ") + langLabel($("srcLang").value);
  $("talkB").textContent = (activeSpeaker === "B" ? "■ 停止 · " : "🎙 B · ") + langLabel($("tgtLang").value);
}

// ---------- Speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) showWarn("此瀏覽器不支援語音辨識（Web Speech API）。請使用 Chrome、Edge 或 Safari，或改用「文字」模式。");
let rec = null, listening = false, activeSpeaker = null; // speaker: "A" | "B"

function startListening(speaker) {
  if (!SR) return;
  activeSpeaker = speaker;
  const lang = speaker === "B" ? $("tgtLang").value : $("srcLang").value;
  rec = new SR();
  rec.lang = lang; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) { const t = r[0].transcript.trim(); if (t) addSegment(t, speaker); }
      else interim += r[0].transcript;
    }
    $("interim").textContent = interim;
    if (interim && $("caption").classList.contains("on")) $("capSrc").textContent = interim;
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { showWarn("麥克風權限被拒絕，請在瀏覽器網址列允許麥克風。"); stopListening(); }
  };
  rec.onend = () => { if (listening && rec) { try { rec.start(); } catch {} } }; // Chrome stops after silence: auto-restart
  listening = true;
  try { rec.start(); } catch {}
  renderListening();
}
function stopListening() {
  listening = false;
  if (rec) { const r = rec; rec = null; try { r.stop(); } catch {} }
  activeSpeaker = null; $("interim").textContent = ""; renderListening();
}
function restartIfListening() { if (listening) { const s = activeSpeaker; stopListening(); startListening(s); } }
function renderListening() {
  const mic = $("micBtn");
  mic.className = "big " + (listening && mode === "speech" ? "rec" : "primary");
  mic.textContent = listening && mode === "speech" ? "■ 停止聆聽" : "● 開始聆聽";
  $("talkA").classList.toggle("rec", activeSpeaker === "A");
  $("talkB").classList.toggle("rec", activeSpeaker === "B");
  updateTalkLabels();
  $("dot").classList.toggle("live", listening);
}
$("micBtn").onclick = () => listening ? stopListening() : startListening("A");
for (const s of ["A","B"]) $("talk" + s).onclick = () => {
  const was = activeSpeaker; stopListening(); if (was !== s) startListening(s);
};

// ---------- Segments & translation ----------
const segments = store.get("segments", []);
let sessionStart = store.get("sessionStart", Date.now());
const ttsQueue = [];

function addSegment(text, speaker) {
  const fromCode = speaker === "B" ? $("tgtLang").value : (mode === "text" ? "auto" : $("srcLang").value);
  const toCode = speaker === "B" ? $("srcLang").value : $("tgtLang").value;
  if (!segments.length) { sessionStart = Date.now(); store.set("sessionStart", sessionStart); }
  const seg = { id: Date.now() + Math.random(), t: Date.now(), speaker: mode === "convo" ? speaker : null,
    from: fromCode, to: toCode, src: text, tgt: "", state: "pending", compose: mode === "compose" };
  segments.push(seg);
  renderCard(seg);
  translate(seg);
}

async function streamSSE(url, payload, onDelta) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Invite-Code": inviteCode() }, body: JSON.stringify(payload) });
  if (!res.ok) {
    let msg = "HTTP " + res.status;
    try { msg = (await res.json()).message || msg; } catch {}
    if (res.status === 401 || res.status === 403 || res.status === 429) checkServer();
    throw new Error(msg);
  }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = (block.match(/^event: (.*)$/m) || [])[1];
      const data = JSON.parse((block.match(/^data: (.*)$/m) || [, "{}"])[1]);
      if (ev === "delta") onDelta(data.text);
      else if (ev === "error") throw new Error(data.message);
    }
  }
}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); }

// ---------- Video assistant (camera + question -> Claude vision) ----------
const frames = {}; // seg.id -> full-size frame (kept in memory only, for retry)
let camStream = null, facing = store.get("facing", "environment");
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) { showWarn("這個瀏覽器不能使用鏡頭。iPhone 請用 Safari，並確認網址是 https://。"); return false; }
  stopCamera();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 } }, audio: false });
  } catch (e) {
    showWarn("無法開啟鏡頭：" + (e.name === "NotAllowedError" ? "請在瀏覽器允許使用相機。" : e.message));
    return false;
  }
  clearStill();
  const v = $("cam"); v.style.display = ""; v.srcObject = camStream; v.style.transform = facing === "user" ? "scaleX(-1)" : "";
  await v.play().catch(() => {});
  $("camOff").style.display = "none"; $("camBtn").textContent = "⏹ 關閉鏡頭";
  return true;
}
function stopCamera() {
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null; $("cam").srcObject = null;
  $("camOff").style.display = stillImage ? "none" : ""; $("camBtn").textContent = "📷 開啟鏡頭";
}

// ---- uploaded picture: used instead of the camera until the camera is opened again
let stillImage = null; // { full, thumb } data URLs
function clearStill() { stillImage = null; $("still").style.display = "none"; $("still").removeAttribute("src"); }
function scaleImage(src, maxSide, q) {
  const k = Math.min(1, maxSide / Math.max(src.naturalWidth || src.videoWidth, src.naturalHeight || src.videoHeight));
  const w = src.naturalWidth || src.videoWidth, h = src.naturalHeight || src.videoHeight;
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
$("uploadBtn").onclick = () => { unlockTts(); $("imgFile").click(); };
$("imgFile").onchange = async () => {
  const file = $("imgFile").files[0]; $("imgFile").value = "";
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    // documents and menus need detail: keep up to 1568px (the model's sweet spot) for uploads
    stillImage = { full: scaleImage(img, 1568, 0.82), thumb: scaleImage(img, 192, 0.6) };
  } catch { showWarn("這張圖片打不開，請換一張（JPG、PNG 或手機照片）。"); return; }
  finally { URL.revokeObjectURL(url); }
  stopCamera(); $("cam").style.display = "none";
  $("still").src = stillImage.full; $("still").style.display = ""; $("camOff").style.display = "none";
  const q = $("textIn").value.trim(); $("textIn").value = "";
  askVision(q); // describe + translate right away (or answer the question typed beforehand)
};
$("camBtn").onclick = () => camStream ? stopCamera() : startCamera();
$("camFlip").onclick = () => { facing = facing === "user" ? "environment" : "user"; store.set("facing", facing); if (camStream) startCamera(); };

// grab what the AI should look at: the uploaded picture, or the current camera frame
// (full: max 1024px for the AI; thumb: small, for the card)
function grabFrame() {
  if (!camStream && stillImage) return stillImage;
  const v = $("cam"); if (!camStream || !v.videoWidth) return null;
  return { full: scaleImage(v, 1024, 0.72), thumb: scaleImage(v, 192, 0.6) };
}
function camState(text) { const el = $("camState"); el.textContent = text; el.style.display = text ? "block" : "none"; }

// iOS only lets a page speak after a user gesture: on the first tap, speak a silent utterance
let ttsUnlocked = false;
function unlockTts() {
  if (ttsUnlocked || !("speechSynthesis" in window)) return;
  ttsUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch {}
}
$("voiceReply").checked = store.get("voiceReply", true);
$("voiceReply").onchange = () => { store.set("voiceReply", $("voiceReply").checked); if (!$("voiceReply").checked) window.speechSynthesis?.cancel(); };

async function askVision(question) {
  if (!camStream && !stillImage && !(await startCamera())) return;
  if (!$("cam").videoWidth) await new Promise(r => setTimeout(r, 400));
  const f = grabFrame(); if (!f) { showWarn("鏡頭還沒準備好，請再按一次。"); return; }
  const lang = $("srcLang").value;
  if (!segments.length) { sessionStart = Date.now(); store.set("sessionStart", sessionStart); }
  const seg = { id: Date.now() + Math.random(), t: Date.now(), kind: "vision", speaker: null, from: lang, to: lang,
    src: question || "（看一下畫面）", q: question, tgt: "", state: "pending", thumb: f.thumb };
  frames[seg.id] = f.full;
  segments.push(seg); renderCard(seg); runVision(seg);
}
async function runVision(seg) {
  const full = frames[seg.id];
  if (!full) { seg.state = "error"; seg.err = "畫面已不在（重新整理過頁面），請重新拍一次。"; updateCard(seg); return; }
  const history = segments.filter(s => s.kind === "vision" && s.state === "done" && s !== seg).slice(-4).map(s => ({ question: s.q || "", answer: s.tgt }));
  seg.tgt = ""; seg.state = "pending"; updateCard(seg); camState("🤔 AI 思考中…");
  const voice = $("voiceReply").checked;
  if (voice) { window.speechSynthesis?.cancel(); ttsQueue.length = 0; speaking = false; }
  let spoken = 0;
  const speakFinished = (final) => { // queue every complete sentence as soon as it arrives
    if (!voice) return;
    const rest = seg.tgt.slice(spoken);
    const m = final ? rest.length : Math.max(...["。", "！", "？", ".", "!", "?", "\n"].map(p => rest.lastIndexOf(p))) + 1;
    if (m > 0 && rest.slice(0, m).trim()) { speak(rest.slice(0, m).trim(), seg.to); spoken += m; }
  };
  try {
    await streamSSE("/api/vision", { image: full.split(",")[1], media_type: "image/jpeg", question: seg.q || "",
      answer_lang: langName(seg.to), history }, (t) => { seg.tgt += t; updateCard(seg); speakFinished(false); });
    seg.state = "done";
    speakFinished(true);
  } catch (e) { seg.state = "error"; seg.err = "回答失敗：" + e.message; }
  camState(""); updateCard(seg); persist();
}

// one spoken question per tap: listen until the sentence ends, then snap the frame and ask
let askRec = null;
function stopAsk() { if (askRec) { const r = askRec; askRec = null; try { r.abort(); } catch {} } $("askBtn").className = "big primary"; $("askBtn").textContent = "🎙 按一下，開口問"; $("interim").textContent = ""; }
$("askBtn").onclick = async () => {
  unlockTts(); window.speechSynthesis?.cancel();
  if (askRec) { stopAsk(); return; }
  if (!SR) { showWarn("此瀏覽器不支援語音辨識，請在右邊輸入框打字問。"); return; }
  if (!camStream && !stillImage && !(await startCamera())) return;
  const r = new SR(); askRec = r;
  r.lang = $("srcLang").value; r.continuous = false; r.interimResults = true; r.maxAlternatives = 1;
  let finalText = "", latest = "";
  r.onresult = (ev) => {
    latest = Array.from(ev.results).map(x => x[0].transcript).join("");
    if (ev.results[ev.results.length - 1].isFinal) finalText = latest;
    $("interim").textContent = latest;
  };
  r.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") showWarn("麥克風權限被拒絕，請在瀏覽器網址列允許麥克風。"); };
  r.onend = () => { const q = (finalText || latest).trim(); const mine = askRec === r; stopAsk(); if (mine && q) askVision(q); };
  $("askBtn").className = "big rec"; $("askBtn").textContent = "■ 聆聽中…（說完會自動送出）";
  try { r.start(); } catch { stopAsk(); }
};
$("lookBtn").onclick = () => { unlockTts(); window.speechSynthesis?.cancel(); askVision(""); };

async function translate(seg) {
  if (seg.kind === "vision") return runVision(seg);
  const context = segments.filter(s => s.state === "done" && s !== seg && s.kind !== "vision").slice(-6).map(s => ({ source: s.src, translation: s.tgt }));
  seg.tgt = ""; seg.state = "pending"; updateCard(seg);
  try {
    await streamSSE("/api/translate", { text: seg.src, source_lang: seg.from === "auto" ? "auto" : langName(seg.from),
      target_lang: langName(seg.to), context, glossary: $("glossary").value, style: $("style").value },
      (t) => { seg.tgt += t; updateCard(seg); });
    seg.state = "done";
  } catch (e) { seg.state = "error"; seg.err = "翻譯失敗：" + e.message; }
  updateCard(seg); persist();
  if (seg.state === "done" && seg.tgt && $("tts").checked) speak(seg.tgt, seg.to);
  if (seg.state === "done" && seg.compose && navigator.clipboard) {
    navigator.clipboard.writeText(seg.tgt).then(() => toast("✓ 已複製譯文，直接貼到聊天或貼文即可"), () => {});
  }
}

function persist() { store.set("segments", segments.slice(-300).map(({ err, thumb, ...s }) => s)); }

function renderCard(seg) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "card" + (seg.speaker ? " " + seg.speaker : ""); el.id = "c" + seg.id;
  el.innerHTML = `<div class="meta"><span class="who"></span><span class="time"></span>
    <span class="acts"><button data-a="speak" title="朗讀">🔊</button><button data-a="copy" title="複製">⧉</button><button data-a="explain" title="解釋俚語 / 語氣">📖</button><button data-a="share" title="分享">📤</button><button data-a="retry" title="重新翻譯">↻</button></span></div>
    <div class="src"></div><div class="tgt"></div><div class="explain" style="display:none"></div>`;
  el.querySelector(".who").textContent = seg.kind === "vision" ? "📹 視訊助手"
    : (seg.speaker ? seg.speaker + " · " : "") + (seg.from === "auto" ? "自動偵測" : langLabel(seg.from)) + " → " + langLabel(seg.to);
  if (seg.kind === "vision") {
    el.querySelector('[data-a="explain"]').remove();
    el.querySelector('[data-a="retry"]').title = "重新回答";
    if (seg.thumb) { const im = document.createElement("img"); im.className = "thumb"; im.src = seg.thumb; im.alt = "當時的畫面"; el.querySelector(".src").before(im); }
  }
  el.querySelector(".time").textContent = new Date(seg.t).toLocaleTimeString();
  el.querySelector(".src").textContent = seg.src;
  el.querySelector(".src").style.display = $("showSrc").checked ? "" : "none";
  el.querySelector('[data-a="speak"]').onclick = () => speak(seg.tgt, seg.to, true);
  el.querySelector('[data-a="copy"]').onclick = () => navigator.clipboard?.writeText(seg.tgt).then(() => toast("✓ 已複製"));
  el.querySelector('[data-a="share"]').onclick = () => navigator.share
    ? navigator.share({ text: seg.tgt }).catch(() => {})
    : navigator.clipboard?.writeText(seg.tgt).then(() => toast("✓ 已複製（此瀏覽器不支援分享）"));
  el.querySelector('[data-a="explain"]')?.addEventListener("click", () => explain(seg, el.querySelector(".explain")));
  el.querySelector('[data-a="retry"]').onclick = () => translate(seg);
  $("feed").prepend(el); // newest on top
  updateCard(seg);
}
async function explain(seg, box) {
  if (box.style.display !== "none" && box.dataset.done) { box.style.display = "none"; return; }
  box.style.display = ""; box.textContent = ""; box.classList.add("caret"); delete box.dataset.done;
  try {
    await streamSSE("/api/explain", { text: seg.src, translation: seg.tgt, target_lang: langName(seg.to),
      explain_lang: langName($("srcLang").value) }, (t) => { box.textContent += t; });
    box.dataset.done = "1";
  } catch (e) { box.textContent = "解釋失敗：" + e.message; }
  box.classList.remove("caret");
}

function updateCard(seg) {
  const el = $("c" + seg.id); if (!el) return;
  const tgt = el.querySelector(".tgt");
  tgt.className = "tgt" + (seg.state === "pending" ? " caret" : "") + (seg.state === "error" ? " err" : "");
  tgt.textContent = seg.state === "error" ? (seg.err || "錯誤") : seg.tgt;
  if (seg === segments[segments.length - 1]) $("feed").scrollTop = 0; // keep the newest sentence in view
  if (seg.kind === "vision" && seg === segments[segments.length - 1]) { // latest answer over the camera view
    $("camAnswer").style.display = "block";
    $("camQ").textContent = "問：" + seg.src;
    $("camA").textContent = seg.state === "error" ? (seg.err || "錯誤") : (seg.tgt || "…");
  }
  if ($("caption").classList.contains("on") && seg === segments[segments.length - 1]) {
    $("capSrc").textContent = seg.src; $("capTgt").textContent = seg.tgt || "…";
  }
}

// ---------- Text-to-speech ----------
let speaking = false;
function speak(text, lang, now) {
  if (!("speechSynthesis" in window) || !text) return;
  if (now) { speechSynthesis.cancel(); ttsQueue.length = 0; speaking = false; }
  ttsQueue.push([text, lang]); if (!speaking) nextTts();
}
function nextTts() {
  const item = ttsQueue.shift(); if (!item) { speaking = false; return; }
  speaking = true;
  const u = new SpeechSynthesisUtterance(item[0]); u.lang = item[1];
  const voice = speechSynthesis.getVoices().find(v => v.lang === item[1]) || speechSynthesis.getVoices().find(v => v.lang.startsWith(item[1].split("-")[0]));
  if (voice) u.voice = voice;
  u.onend = u.onerror = nextTts;
  speechSynthesis.speak(u);
}

// ---------- Text mode ----------
function sendText() {
  const t = $("textIn").value.trim(); if (!t) return; $("textIn").value = "";
  if (mode === "vision") { unlockTts(); askVision(t); } else addSegment(t, "A");
}
$("sendText").onclick = sendText;
$("textIn").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); } };

// ---------- Caption mode ----------
let capSize = store.get("capSize", 6);
document.documentElement.style.setProperty("--cap", capSize + "vh");
$("captionBtn").onclick = () => { $("caption").classList.add("on"); document.documentElement.requestFullscreen?.().catch(() => {});
  const last = segments[segments.length - 1]; if (last) { $("capSrc").textContent = last.src; $("capTgt").textContent = last.tgt; } };
function closeCaption() { $("caption").classList.remove("on"); if (document.fullscreenElement) document.exitFullscreen(); }
$("capClose").onclick = closeCaption;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCaption(); });
for (const [id, d] of [["capMinus", -1], ["capPlus", 1]]) $(id).onclick = () => {
  capSize = Math.max(3, Math.min(14, capSize + d)); store.set("capSize", capSize);
  document.documentElement.style.setProperty("--cap", capSize + "vh");
};

// ---------- Export / clear ----------
function download(name, text) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
$("exportTxt").onclick = () => download(`translation-${stamp()}.txt`, segments.map(s =>
  `[${new Date(s.t).toLocaleTimeString()}]${s.speaker ? " " + s.speaker : ""}\n${s.src}\n${s.tgt}\n`).join("\n"));
$("exportSrt").onclick = () => {
  const fmt = (ms) => { ms = Math.max(0, ms); const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")},${String(ms % 1000).padStart(3,"0")}`; };
  const t0 = segments[0]?.t || 0;
  download(`subtitles-${stamp()}.srt`, segments.map((s, i) => {
    const start = s.t - t0, end = (segments[i + 1] ? segments[i + 1].t - t0 : start + 4000);
    return `${i + 1}\n${fmt(start)} --> ${fmt(Math.max(end - 100, start + 800))}\n${s.tgt}\n`;
  }).join("\n"));
};
$("clearBtn").onclick = () => { if (!confirm("清除所有逐字稿？")) return; segments.length = 0; persist();
  $("feed").innerHTML = '<div class="empty" id="empty">已清除。</div>'; };

// ---------- Installable app (PWA) ----------
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; $("installBtn").style.display = ""; });
$("installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("installBtn").style.display = "none"; };

// ---------- Init ----------
setMode(mode);
for (const s of segments) { if (s.state === "pending") s.state = "error", s.err = "（已中斷，按 ↻ 重新翻譯）"; renderCard(s); }
</script>
