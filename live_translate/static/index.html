<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muối Từ · Phiên Dịch AI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="theme-color" content="#047857">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --ink: #1d2320; --muted: #5f6b66; --line: #e4e0d6;
    --brand: #047857; --brand-ink: #ffffff; --brand-soft: #e3f3ec;
    --a: #1d4ed8; --a-soft: #e6edfd; --b: #b45309; --b-soft: #fbefe1;
    --danger: #b42318; --danger-soft: #fdeceb; --rec: #c62828;
    --edge: #b9b2a3; --edge-w: 2px;
    --shadow: 0 2px 4px rgba(30,35,30,.08), 0 10px 26px rgba(30,35,30,.10);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111513; --surface:#1a201d; --ink:#eef2ef; --muted:#a3ada8; --line:#2b332f;
      --brand:#34d399; --brand-ink:#05261b; --brand-soft:#173328;
      --a:#93b4ff; --a-soft:#1d2840; --b:#fbbf74; --b-soft:#3a2a15;
      --danger:#ff8a80; --danger-soft:#3a1d1b; --rec:#ef5350; --edge:#4a554f; --shadow:0 6px 20px rgba(0,0,0,.45); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { font-size:18px; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:1rem/1.6 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; border:0; background:none; }
  [hidden] { display:none !important; }

  /* ---------- top bar ---------- */
  .top { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:var(--bg); background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(10px); border-bottom:var(--edge-w) solid var(--edge); }
  .brand { display:flex; align-items:baseline; gap:8px; min-width:0; }
  .brand b { color:var(--brand); font-size:1.25rem; letter-spacing:.2px; white-space:nowrap; }
  .brand span { color:var(--muted); font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .title { font-size:1.2rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .spacer { flex:1; }
  .pill-btn { display:inline-flex; align-items:center; gap:6px; padding:10px 16px; border-radius:999px;
    background:var(--surface); border:var(--edge-w) solid var(--edge); font-size:.95rem; font-weight:600; min-height:48px; white-space:nowrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.ok { background:var(--brand); } .dot.bad { background:var(--danger); }

  main { max-width:760px; margin:0 auto; padding:16px 16px 24px; }
  .banner { background:var(--danger-soft); color:var(--danger); border-radius:14px; padding:12px 16px; margin-bottom:14px; font-size:.95rem; }

  /* ---------- home ---------- */
  .hello { font-size:1.5rem; font-weight:800; margin:6px 2px 4px; }
  .sub { color:var(--muted); margin:0 2px 16px; }
  .invite-card { background:var(--surface); border:3px solid var(--brand); border-radius:var(--radius); padding:18px; margin-bottom:18px; box-shadow:var(--shadow); }
  .invite-card h2 { margin:0 0 4px; font-size:1.15rem; }
  .invite-row { display:flex; gap:10px; margin-top:12px; }
  .invite-row input { flex:1; min-width:0; }
  .tiles { display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width: 640px) { .tiles { grid-template-columns:1fr 1fr; } }
  .tile { display:flex; align-items:center; gap:16px; text-align:left; background:var(--surface); border:var(--edge-w) solid var(--edge);
    border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); min-height:104px; transition:transform .08s; }
  .tile:active { transform:scale(.98); }
  .tile .ic { flex:none; width:64px; height:64px; border-radius:18px; display:grid; place-items:center; font-size:2rem; background:var(--brand-soft); border:var(--edge-w) solid color-mix(in srgb, var(--brand) 35%, transparent); }
  .tile b { display:block; font-size:1.2rem; line-height:1.35; }
  .tile small { display:block; color:var(--muted); font-size:.9rem; line-height:1.45; margin-top:2px; }
  .tile.main { border:3px solid var(--brand); }

  /* ---------- work view ---------- */
  /* two full-width rows (from / to) so long language names are never cut off; swap button on the right */
  .langbar { background:var(--surface); border:3px solid var(--brand); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow);
    display:grid; grid-template-columns:1fr auto; column-gap:12px; row-gap:10px; align-items:end; }
  .langbar .lf { min-width:0; grid-column:1; }
  .langbar .swap { grid-column:2; grid-row:1 / span 2; align-self:center; }
  .langbar label { display:block; font-size:.8rem; font-weight:700; color:var(--muted); margin:0 4px 4px; }
  .langbar.a-b .lf:first-child label { color:var(--a); } .langbar.a-b .lf:last-child label { color:var(--b); }
  select, input[type=text], textarea { width:100%; border:var(--edge-w) solid var(--edge); background:var(--bg); border-radius:14px;
    padding:12px 14px; font-size:1.05rem; min-height:54px; }
  select { appearance:none; -webkit-appearance:none; font-weight:600;
    background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size:6px 6px; background-repeat:no-repeat; padding-right:34px; }
  .swap { flex:none; width:54px; height:54px; border-radius:50%; border:var(--edge-w) solid var(--edge); background:var(--bg); font-size:1.3rem; }
  .subrow { display:flex; justify-content:flex-end; margin-top:8px; }
  .link-btn { color:var(--brand); font-weight:700; padding:8px 6px; font-size:.95rem; min-height:44px; }

  /* camera stage */
  .stage { position:relative; margin-top:18px; border-radius:var(--radius); overflow:hidden; background:#000; height:min(52vh, 110vw); box-shadow:var(--shadow); border:3px solid var(--ink); }
  .stage video, .stage img.still { width:100%; height:100%; object-fit:cover; display:block; }
  .stage img.still { object-fit:contain; }
  .stage .off { position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:#d6dbd8; padding:24px; font-size:1.05rem; line-height:1.7; }
  .stage .off b { display:block; font-size:2.6rem; margin-bottom:6px; }
  .stage .tools { position:absolute; top:10px; right:10px; display:flex; gap:8px; }
  .stage .tools button { background:rgba(0,0,0,.55); color:#fff; border-radius:999px; padding:8px 14px; font-size:.9rem; font-weight:600; min-height:44px; }
  .stage .state { position:absolute; top:12px; left:12px; background:rgba(0,0,0,.6); color:#fff; font-size:.9rem; padding:6px 12px; border-radius:999px; }
  .stage .answer { position:absolute; left:0; right:0; bottom:0; max-height:48%; overflow:auto; color:#fff; padding:28px 16px 14px;
    background:linear-gradient(transparent, rgba(0,0,0,.85) 20%); font-size:1.15rem; line-height:1.55; white-space:pre-wrap; }
  .stage .answer .q { color:#c9d3ce; font-size:.85rem; margin-bottom:4px; }

  /* transcript */
  .listening { margin-top:16px; border:var(--edge-w) solid var(--brand); background:var(--brand-soft); color:var(--ink); border-radius:16px; padding:12px 16px; font-size:1.05rem; }
  .listening::before { content:"正在聽："; color:var(--brand); font-weight:700; }
  .sect { display:flex; align-items:center; gap:10px; margin:22px 2px 0; font-size:.95rem; font-weight:800; color:var(--muted); }
  .sect::after { content:""; flex:1; height:var(--edge-w); background:var(--edge); border-radius:2px; }
  #feed { margin-top:12px; display:flex; flex-direction:column; gap:14px; }
  .empty { background:var(--surface); border:var(--edge-w) dashed var(--edge); border-radius:var(--radius); padding:26px 20px; color:var(--muted); text-align:center; line-height:1.8; }
  .empty b { display:block; color:var(--ink); font-size:1.1rem; margin-bottom:6px; }
  .card { background:var(--surface); border:var(--edge-w) solid var(--edge); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .card.A { border-left:6px solid var(--a); } .card.B { border-left:6px solid var(--b); }
  .card .meta { font-size:.8rem; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; }
  .card .meta .who { font-weight:700; }
  .card.A .meta .who { color:var(--a); } .card.B .meta .who { color:var(--b); }
  .card .src { color:var(--muted); margin-top:6px; font-size:1rem; }
  .card .tgt { margin-top:6px; font-size:1.35rem; font-weight:600; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .card .tgt.err { color:var(--danger); font-size:1rem; font-weight:500; }
  .card .thumb { width:110px; height:82px; object-fit:cover; border-radius:12px; float:right; margin:4px 0 8px 12px; }
  .card::after { content:""; display:block; clear:both; }
  .card .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:12px; border-top:var(--edge-w) solid var(--line); }
  .card .acts button { background:var(--bg); border:var(--edge-w) solid var(--edge); border-radius:999px; padding:8px 14px; font-size:.9rem; font-weight:600; min-height:44px; }
  .card .explain { margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--brand-soft); border-left:4px solid var(--brand); font-size:1rem; white-space:pre-wrap; }
  .caret::after { content:"▍"; color:var(--brand); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* ---------- bottom dock (one big action) ---------- */
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--surface); background:color-mix(in srgb, var(--surface) 96%, transparent);
    backdrop-filter:blur(10px); border-top:3px solid var(--brand); box-shadow:0 -8px 24px rgba(0,0,0,.08);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .dock-in { max-width:760px; margin:0 auto; }
  .big { width:100%; min-height:72px; border-radius:22px; font-size:1.3rem; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brand); color:var(--brand-ink); box-shadow:0 4px 14px color-mix(in srgb, var(--brand) 35%, transparent); }
  .big.rec { background:var(--rec); color:#fff; box-shadow:0 4px 14px color-mix(in srgb, var(--rec) 35%, transparent); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { filter:brightness(1.12); } }
  .hint { text-align:center; color:var(--muted); font-size:.85rem; margin-top:8px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .turns { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin-bottom:10px; }
  .turns .arrow { color:var(--muted); font-weight:800; }
  .turn { border-radius:16px; padding:8px 6px; font-weight:800; font-size:1rem; line-height:1.3; min-height:60px; border:var(--edge-w) solid; opacity:.55; }
  .turn small { display:block; font-weight:600; font-size:.8rem; }
  .turn.A { color:var(--a); border-color:var(--a); background:var(--a-soft); }
  .turn.B { color:var(--b); border-color:var(--b); background:var(--b-soft); }
  .turn.on { opacity:1; border-width:3px; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
  .talk { min-height:84px; border-radius:22px; font-size:1.15rem; font-weight:800; line-height:1.3; padding:8px; }
  .talk small { display:block; font-size:.85rem; font-weight:600; opacity:.85; }
  .talk.A { background:var(--a-soft); color:var(--a); border:2px solid var(--a); }
  .talk.B { background:var(--b-soft); color:var(--b); border:2px solid var(--b); }
  .talk.rec { background:var(--rec); border-color:var(--rec); color:#fff; animation:pulse 1.4s infinite; }
  .row3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
  .soft { background:var(--bg); border:var(--edge-w) solid var(--edge); border-radius:16px; min-height:56px; font-size:.95rem; font-weight:700; padding:6px; }
  .typing { display:flex; gap:10px; align-items:flex-end; }
  .typing textarea { min-height:56px; max-height:140px; resize:none; }
  .send { flex:none; min-width:84px; min-height:56px; border-radius:16px; background:var(--brand); color:var(--brand-ink); font-weight:800; font-size:1.1rem; padding:0 14px; }

  /* ---------- settings sheet ---------- */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:31; max-height:88vh; overflow:auto; background:var(--bg); border-top:3px solid var(--brand);
    border-radius:24px 24px 0 0; padding:8px 16px calc(24px + env(safe-area-inset-bottom)); }
  .sheet-in { max-width:760px; margin:0 auto; }
  .sheet-head { display:flex; align-items:center; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:1; }
  .sheet-head h2 { margin:0; font-size:1.3rem; flex:1; }
  .group { background:var(--surface); border:var(--edge-w) solid var(--edge); border-radius:var(--radius); padding:6px 16px; margin-top:16px; box-shadow:var(--shadow); }
  .group h3 { font-size:.9rem; color:var(--brand); margin:12px 0 4px; letter-spacing:.5px; }
  .item { padding:12px 0; border-top:1px solid var(--line); }
  .group h3 + .item { border-top:0; }
  .switch { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; }
  .switch input { appearance:none; -webkit-appearance:none; width:58px; height:34px; border-radius:999px; background:var(--line); position:relative; flex:none; transition:background .15s; }
  .switch input::after { content:""; position:absolute; top:3px; left:3px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s; }
  .switch input:checked { background:var(--brand); }
  .switch input:checked::after { left:27px; }
  .status { font-size:.95rem; margin-top:8px; }
  .status.ok { color:var(--brand); } .status.bad { color:var(--danger); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .danger { color:var(--danger); }

  .toast { position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:12px 20px; border-radius:999px; font-size:1rem; opacity:0; transition:opacity .2s; pointer-events:none; z-index:40; max-width:90vw; text-align:center; }
  .toast.on { opacity:.95; }

  /* fullscreen captions */
  #caption { position:fixed; inset:0; background:#000; color:#fff; display:none; flex-direction:column; justify-content:flex-end; padding:5vh 6vw; z-index:50; }
  #caption.on { display:flex; }
  #caption .c-src { color:#9aa1b2; font-size:3.2vh; margin-bottom:1.5vh; }
  #caption .c-tgt { font-size:var(--cap, 6vh); font-weight:700; line-height:1.3; }
  #caption .c-bar { position:absolute; top:calc(16px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; gap:8px; }
  #caption .c-bar button { background:#222; color:#fff; border-radius:999px; padding:10px 16px; min-height:48px; font-weight:700; }

  /* ---------- bilingual labels: English sits under the Chinese, a little smaller ---------- */
  .en { display:block; font-size:.74em; font-weight:600; opacity:.78; line-height:1.3; margin-top:1px; letter-spacing:.1px; }
  .title .en { font-size:.62em; }
  .link-btn .en { display:inline; margin-left:4px; }
  /* header buttons: compact, Chinese over English, so the screen title keeps its room */
  .top .pill-btn { flex-direction:column; justify-content:center; gap:0; padding:6px 12px; line-height:1.15; position:relative; min-width:60px; }
  .top .pill-btn .en { font-size:.68em; margin:0; }
  .top #settingsBtn .dot { position:absolute; top:6px; right:6px; width:9px; height:9px; }
  .title { font-size:1.08rem; line-height:1.2; }
  .tile small .en { font-size:.95em; opacity:.85; }
  .card .srcs { margin-top:10px; font-size:.85rem; color:var(--muted); }
  .card .srcs a { display:block; color:var(--a); padding:3px 0; word-break:break-word; }
  .card .status-line { margin-top:8px; font-size:.95rem; color:var(--brand); font-weight:700; }
  .listening b { color:var(--brand); }
  .listening::before { content:none; }
</style>
</head>
<body>

<header class="top">
  <button class="pill-btn" id="backBtn" hidden data-h="back"></button>
  <div class="brand" id="brand"><b>Muối Từ</b><span>Phiên Dịch AI</span></div>
  <div class="title" id="viewTitle" hidden></div>
  <div class="spacer" id="topSpacer"></div>
  <button class="pill-btn" id="settingsBtn"><span class="dot" id="dot"></span><span data-h="settings"></span></button>
</header>

<main>
  <div class="banner" id="warn" hidden></div>

  <!-- ================= HOME ================= -->
  <section id="home">
    <div class="invite-card" id="inviteCard" hidden>
      <h2 data-h="inviteTitle"></h2>
      <div style="color:var(--muted)" data-h="inviteWhy"></div>
      <div class="invite-row">
        <input type="text" id="inviteHome" data-ph="inviteEg" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="send" data-save-invite="inviteHome" data-h="ok"></button>
      </div>
      <div class="status" id="inviteHomeStatus"></div>
    </div>

    <div class="hello" data-h="hello"></div>
    <p class="sub" data-h="helloSub"></p>
    <div class="tiles">
      <button class="tile main" data-go="speech"><span class="ic">🎙</span><span><b data-h="tSpeech"></b><small data-h="tSpeechD"></small></span></button>
      <button class="tile" data-go="convo"><span class="ic">💬</span><span><b data-h="tConvo"></b><small data-h="tConvoD"></small></span></button>
      <button class="tile" data-go="ask"><span class="ic">🔎</span><span><b data-h="tAsk"></b><small data-h="tAskD"></small></span></button>
      <button class="tile" data-go="vision"><span class="ic">📹</span><span><b data-h="tVision"></b><small data-h="tVisionD"></small></span></button>
      <button class="tile" data-go="text"><span class="ic">⌨️</span><span><b data-h="tText"></b><small data-h="tTextD"></small></span></button>
      <button class="tile" data-go="compose"><span class="ic">✍️</span><span><b data-h="tCompose"></b><small data-h="tComposeD"></small></span></button>
    </div>
  </section>

  <!-- ================= WORK VIEW (shared by every function) ================= -->
  <section id="work" hidden>
    <div class="langbar" id="langbar">
      <div class="lf"><label for="srcLang" id="srcLabel"></label><select id="srcLang"></select></div>
      <button class="swap" id="swap" aria-label="⇄">⇄</button>
      <div class="lf" id="tgtBox"><label for="tgtLang" id="tgtLabel"></label><select id="tgtLang"></select></div>
    </div>
    <div class="subrow" id="captionRow"><button class="link-btn" id="captionBtn" data-h="caption"></button></div>

    <div class="stage" id="stage" hidden>
      <video id="cam" playsinline muted autoplay></video>
      <img class="still" id="still" alt="" hidden>
      <div class="off" id="camOff"><div><b>📷</b><span data-h="camOff"></span></div></div>
      <div class="state" id="camState" hidden></div>
      <div class="tools"><button id="camBtn"></button><button id="camFlip" data-h="flip"></button></div>
      <div class="answer" id="camAnswer" hidden><div class="q" id="camQ"></div><div id="camA"></div></div>
    </div>

    <div class="sect" id="feedTitle"></div>
    <div class="listening" id="interim" hidden></div>
    <div id="feed"></div>
  </section>
</main>

<!-- ================= BOTTOM DOCK ================= -->
<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <div id="dSpeech">
      <div class="turns" id="turns">
        <button class="turn A" id="turnA"></button>
        <span class="arrow">⇄</span>
        <button class="turn B" id="turnB"></button>
      </div>
      <button class="big" id="micBtn"></button>
      <div class="hint" id="micHint"></div>
    </div>
    <div id="dConvo">
      <div class="two">
        <button class="talk A" id="talkA"></button>
        <button class="talk B" id="talkB"></button>
      </div>
      <div class="hint" data-h="convoHint"></div>
    </div>
    <div id="dAsk">
      <button class="big" id="askBtn"></button>
      <div class="row3" id="visionRow">
        <button class="soft" id="lookBtn" data-h="look"></button>
        <button class="soft" id="uploadBtn" data-h="upload"></button>
        <button class="soft" id="typeBtn" data-h="typeAsk"></button>
      </div>
      <input type="file" id="imgFile" accept="image/*" hidden>
    </div>
    <div class="typing" id="dTyping" style="margin-top:10px">
      <textarea id="textIn" rows="1"></textarea>
      <button class="send" id="sendText"></button>
    </div>
  </div>
</div>

<!-- ================= SETTINGS ================= -->
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog">
  <div class="sheet-in">
    <div class="sheet-head"><h2 data-h="settings"></h2><button class="pill-btn" id="sheetClose" data-h="done"></button></div>

    <div class="group">
      <h3 data-h="gUi"></h3>

<script>
// ===================== bilingual interface =====================
// Every label exists in Chinese and English. "both" shows Chinese with English underneath
// (or "中文 / English" on one line for messages); the setting can also show just one language.
let uiLang = (() => { try { return JSON.parse(localStorage.getItem("ll_uiLang")) || "both"; } catch { return "both"; } })();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const T = (zh, en) => uiLang === "zh" ? zh : uiLang === "en" ? en : `${zh} / ${en}`;           // one line, plain text
const H = (zh, en) => uiLang === "zh" ? esc(zh) : uiLang === "en" ? esc(en) : `${esc(zh)}<span class="en">${esc(en)}</span>`; // two lines
const srvMsg = (m) => { const p = String(m).split(" / "); return p.length === 2 ? T(p[0], p[1]) : m; }; // server messages are "中文 / English"

const I18N = {
  back: ["‹ 首頁", "Home"], settings: ["⚙️ 設定", "Settings"], ok: ["確認", "OK"], done: ["完成", "Done"], close: ["✕ 關閉", "Close"],
  inviteTitle: ["🔑 請輸入邀請碼", "Enter your invite code"],
  inviteWhy: ["邀請碼由送你這個網址的人提供，輸入一次就會記住。", "You get it from the person who sent you this link. Enter it once; it's remembered."],
  inviteEg: ["例如 TUMUOI-1954", "e.g. TUMUOI-1954"], inviteCode: ["邀請碼", "Invite code"],
  hello: ["您好！今天要做什麼？", "Hello! What would you like to do?"],
  helloSub: ["點一下下面的大按鈕就可以開始。", "Tap a big button below to start."],
  tSpeech: ["聽我說，幫我翻譯", "Listen & translate"],
  tSpeechD: ["你說中文就唸英文，對方說英文就唸中文，自動輪流（依你選的語言）", "Speak, hear the translation, and it switches to the other person automatically"],
  tConvo: ["兩個人對話", "Two-person conversation"],
  tConvoD: ["你說一句、對方說一句，各按自己的按鈕", "Each person taps their own button to talk"],
  tAsk: ["問 AI（會上網查）", "Ask AI (searches the web)"],
  tAskD: ["天氣、新聞、價格、營業時間…開口問就好", "Weather, news, prices, opening hours… just ask"],
  tVision: ["拍給 AI 看", "Show it to AI"],
  tVisionD: ["用鏡頭或照片問 AI：藥盒、菜單、路牌、說明書", "Ask about what the camera sees: medicine, menus, signs"],
  tText: ["打字翻譯", "Type to translate"], tTextD: ["輸入任何語言的文字，自動翻譯", "Type in any language, it's translated"],
  tCompose: ["寫訊息給朋友", "Write a message"], tComposeD: ["用自己的話寫，翻好自動複製，直接貼到聊天", "Write it your way; the translation is copied for you to paste"],
  caption: ["🖥 全螢幕大字幕", "Big captions"],
  camOff: ["按下面「開口問」或「看一下」就會打開鏡頭", "Tap “Ask” or “Look” below to open the camera"],
  flip: ["🔄 前/後", "Flip"],
  convoHint: ["輪到誰說話，就按誰的按鈕；再按一下停止", "Whoever is speaking taps their button; tap again to stop"],
  look: ["👀 看一下", "Look"], upload: ["🖼 上傳照片", "Photo"], typeAsk: ["⌨️ 打字問", "Type"],
  gUi: ["界面語言", "Interface language"], gConn: ["連線", "Connection"], gVoice: ["聲音", "Voice"], gTrans: ["翻譯", "Translation"], gRecords: ["紀錄", "History"],
  sAutoSpeak: ["「聽我說」「兩個人對話」翻好馬上唸出來", "Read translations aloud right away (Listen / Conversation)"],
  sAutoTurn: ["「聽我說」雙向：一個人說完，自動換另一個人說", "Listen mode is two-way: switch speakers after each sentence"],
  sVoiceReply: ["AI 的回答（問 AI、拍給 AI 看）每次都唸出來", "Read AI answers aloud (Ask AI, Show it to AI)"],
  style: ["翻譯風格", "Translation style"],
  stNatural: ["自然（忠實原意）", "Natural"], stCasual: ["輕鬆口語", "Casual"], stSocial: ["社群道地（網路用語）", "Social media slang"],
  stFormal: ["正式禮貌", "Formal"], stBusiness: ["商務專業", "Business"],
  sShowSrc: ["顯示原文", "Show the original text"],
  glossary: ["專有名詞（選填）", "Glossary (optional)"], glossaryHint: ["一行一條，例如：招標 = tender", "One per line, e.g. 招標 = tender"],
  dlTxt: ["⬇ 下載文字檔", "Download text"], dlSrt: ["⬇ 下載字幕檔", "Download subtitles"],
  clearAll: ["🗑 清除所有紀錄", "Clear all history"], install: ["📲 安裝到手機主畫面", "Add to home screen"],
  footer: ["語音辨識使用手機瀏覽器內建功能（iPhone 請用 Safari）。翻譯與回答由 Claude AI 提供。", "Speech recognition uses your browser (Safari on iPhone). Translations and answers by Claude AI."],
};
function applyI18n() {
  document.documentElement.lang = uiLang === "en" ? "en" : "zh-Hant";
  document.querySelectorAll("[data-h]").forEach(el => { const k = I18N[el.dataset.h]; if (k) el.innerHTML = H(...k); });
  document.querySelectorAll("[data-t]").forEach(el => { const k = I18N[el.dataset.t]; if (k) el.textContent = T(...k); });
  document.querySelectorAll("[data-ph]").forEach(el => { const k = I18N[el.dataset.ph]; if (k) el.placeholder = T(...k); });
  $("still").alt = T("上傳的照片", "Uploaded photo");
}

// ===================== data & helpers =====================
const LANGS = [
  ["zh-TW","繁體中文（台灣）","Traditional Chinese (Taiwan)"],
  ["zh-HK","粵語（香港）","Cantonese / Traditional Chinese (Hong Kong)"],

  ["en-GB","English (UK)","British English"],

  ["ja-JP","日本語","Japanese"],
  ["ko-KR","한국어","Korean"],
  ["th-TH","ไทย","Thai"],
  ["id-ID","Bahasa Indonesia","Indonesian"],
  ["ms-MY","Bahasa Melayu","Malay"],
  ["fil-PH","Filipino","Filipino"],
  ["km-KH","ខ្មែរ","Khmer"],
  ["lo-LA","ລາວ","Lao"],
  ["my-MM","မြန်မာ","Burmese"],

  ["es-MX","Español (México)","Mexican Spanish"],

  ["ro-RO","Română","Romanian"],
  ["bg-BG","Български","Bulgarian"],
  ["el-GR","Ελληνικά","Greek"],
  ["uk-UA","Українська","Ukrainian"],
  ["ru-RU","Русский","Russian"],
  ["tr-TR","Türkçe","Turkish"],
  ["ar-SA","العربية","Arabic"],
  ["he-IL","עברית","Hebrew"],
  ["fa-IR","فارسی","Persian"],
  ["sw-KE","Kiswahili","Swahili"],
  ["af-ZA","Afrikaans","Afrikaans"],
  ["zu-ZA","isiZulu","Zulu"],
  ["am-ET","አማርኛ","Amharic"],
  ["wo-SN","Wolof","Wolof"],
];
const $ = (id) => document.getElementById(id);
const show = (el, on) => { (typeof el === "string" ? $(el) : el).hidden = !on; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("ll_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ll_" + k, JSON.stringify(v)); } catch {} },
};
const langName = (code) => (LANGS.find(l => l[0] === code) || [code, code, code])[2];
const langLabel = (code) => code === "auto" ? T("自動偵測", "Auto-detect") : (LANGS.find(l => l[0] === code) || [code, code])[1];
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2600); }
function showWarn(msg) { $("warn").textContent = msg; show("warn", !!msg); }
$("warn").onclick = () => show("warn", false);

// ===================== the six functions =====================
const MODES = {
  speech:  { title: ["🎙 聽我說", "Listen"], empty: [["按下面的綠色大按鈕，對著手機說話", "Tap the big green button and speak"], ["說完一句會自動翻譯並唸出來，然後換另一個人說", "Each sentence is translated, read aloud, then it's the other person's turn"]] },
  convo:   { title: ["💬 兩個人對話", "Conversation"], empty: [["輪到誰說話，就按下面誰的按鈕", "Whoever speaks taps their button below"], ["藍色是你，橘色是對方；翻譯會自動對調", "Blue is you, orange is the other person"]] },
  ask:     { title: ["🔎 問 AI", "Ask AI"], empty: [["按「開口問」或在下面打字問", "Tap “Ask” or type your question below"], ["需要最新消息時，AI 會自己上網查，並附上資料來源", "When it needs current facts, the AI searches the web and lists its sources"]] },
  vision:  { title: ["📹 拍給 AI 看", "Show it to AI"], empty: [["把鏡頭對準要問的東西，按「開口問」", "Point the camera at it and tap “Ask”"], ["也可以按「看一下」讓 AI 說明畫面，或「上傳照片」", "Or tap “Look” to have it explained, or upload a photo"]] },
  text:    { title: ["⌨️ 打字翻譯", "Type to translate"], empty: [["在下面輸入文字，按「翻譯」", "Type below and tap “Translate”"], ["任何語言都可以，會自動偵測", "Any language — it's detected automatically"]] },
  compose: { title: ["✍️ 寫訊息", "Write a message"], empty: [["用自己的語言寫下想說的話，按「翻譯」", "Write in your own language and tap “Translate”"], ["翻好會自動複製，直接到聊天軟體貼上就好", "The translation is copied — just paste it into your chat"]] },
};
const AI_KINDS = new Set(["ask", "vision"]);
let mode = "home";

// ===================== settings & language pickers =====================
for (const sel of [$("srcLang"), $("tgtLang")]) for (const [code, label] of LANGS) sel.add(new Option(label, code));
$("srcLang").value = store.get("src", "zh-TW");
$("tgtLang").value = store.get("tgt", "en-US");
$("uiLang").value = uiLang;
$("uiLang").onchange = () => { uiLang = $("uiLang").value; store.set("uiLang", uiLang); refreshTexts(); };
$("tts").checked = store.get("autoSpeak", true);
$("voiceReply").checked = store.get("voiceReply", true);
$("autoTurn").checked = store.get("autoTurn", true);
$("autoTurn").onchange = () => { store.set("autoTurn", $("autoTurn").checked); if (mode === "speech") { stopListening(); enter("speech"); } };
const twoWay = () => mode === "speech" && $("autoTurn").checked;
const langOf = (sp) => sp === "B" ? $("tgtLang").value : $("srcLang").value;
$("showSrc").checked = store.get("showSrc", true);
$("glossary").value = store.get("glossary", "");
$("style").value = store.get("style", "natural");
$("style").onchange = () => store.set("style", $("style").value);
$("tts").onchange = () => { store.set("autoSpeak", $("tts").checked); if (!$("tts").checked) window.speechSynthesis?.cancel(); };
$("voiceReply").onchange = () => { store.set("voiceReply", $("voiceReply").checked); if (!$("voiceReply").checked) window.speechSynthesis?.cancel(); };
$("showSrc").onchange = () => { store.set("showSrc", $("showSrc").checked); renderFeed(); };
$("glossary").oninput = () => store.set("glossary", $("glossary").value);
for (const id of ["srcLang", "tgtLang"]) $(id).onchange = () => { store.set(id === "srcLang" ? "src" : "tgt", $(id).value); updateTalkLabels(); restartIfListening(); renderListening(); };
$("swap").onclick = () => { const s = $("srcLang").value; $("srcLang").value = $("tgtLang").value; $("tgtLang").value = s;
  store.set("src", $("srcLang").value); store.set("tgt", $("tgtLang").value); updateTalkLabels(); restartIfListening(); renderListening(); };

function openSheet() { show("sheet", true); show("sheetBg", true); checkServer(); }
function closeSheet() { show("sheet", false); show("sheetBg", false); }
$("settingsBtn").onclick = openSheet; $("sheetClose").onclick = closeSheet; $("sheetBg").onclick = closeSheet;

// re-render every label after the interface language changes
function refreshTexts() {
  applyI18n();
  if (mode !== "home") setupView(mode); else checkServer();
  renderListening(); renderFeed(); updateCamButton(); stopAsk(); checkServer();
  $("capTgt").textContent = $("capTgt").textContent || T("等待說話…", "Waiting for speech…");
}

// ===================== invite code + server health =====================
const inviteCode = () => (store.get("invite", "") || "").trim().toUpperCase();
$("inviteHome").value = $("inviteSet").value = inviteCode();
document.querySelectorAll("[data-save-invite]").forEach(btn => {
  const input = $(btn.dataset.saveInvite);
  const save = () => { const v = input.value.trim().toUpperCase(); store.set("invite", v); $("inviteHome").value = $("inviteSet").value = v; checkServer(); };
  btn.onclick = save; input.onkeydown = (e) => { if (e.key === "Enter") save(); };
});
let inviteOk = true;
function checkServer() {
  return fetch("/api/health", { headers: { "X-Invite-Code": inviteCode() } }).then(r => r.json()).then(h => {
    inviteOk = !h.invite_required || h.invite === "ok";
    const ok = h.credentials && inviteOk;
    $("dot").className = "dot " + (ok ? "ok" : "bad");
    let msg, cls;
    if (!h.credentials) { msg = T("伺服器還沒設定 API 金鑰，暫時不能使用。", "The server has no API key yet, so it can't be used."); cls = "bad"; }
    else if (!inviteOk) { msg = h.invite_message ? srvMsg(h.invite_message) : T("請輸入邀請碼", "Please enter your invite code"); cls = "bad"; }
    else {
      const who = h.invite_name ? `${h.invite_name}，` : "";
      msg = "✓ " + T(`${who}已連線，可以使用`, `${h.invite_name ? h.invite_name + ", " : ""}connected and ready`)
        + (h.daily_limit ? T(`（今天已用 ${h.used_today} / ${h.daily_limit} 次）`, ` (${h.used_today} / ${h.daily_limit} used today)`) : "");
      cls = "ok";
    }
    for (const id of ["serverStatus", "inviteHomeStatus"]) { $(id).textContent = msg; $(id).className = "status " + cls; }
    show("inviteCard", h.invite_required && !inviteOk);
  }).catch(() => { $("dot").className = "dot bad"; $("serverStatus").textContent = T("連不上伺服器，請檢查網路。", "Can't reach the server. Check your connection."); $("serverStatus").className = "status bad"; });
}

// ===================== navigation (home <-> function), phone back gesture works =====================
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
$("backBtn").onclick = () => { if (history.length > 1 && location.hash) history.back(); else location.hash = ""; };
window.addEventListener("hashchange", route);
function route() { const m = location.hash.slice(1); enter(MODES[m] ? m : "home"); }

function enter(m) {
  if (AI_KINDS.has(mode) && m !== mode) stopAsk();
  if (mode === "vision" && m !== "vision") stopCamera();
  stopListening();
  mode = m;
  const home = m === "home";
  show("home", home); show("work", !home); show("dock", !home);
  show("backBtn", !home); show("brand", home); show("viewTitle", !home); show("topSpacer", home);
  window.scrollTo(0, 0);
  if (home) { checkServer(); return; }
  setupView(m);
  renderListening(); renderFeed(); fitDock();
}

// labels and layout of a function screen (also re-run when the interface language changes)
function setupView(m) {
  $("viewTitle").innerHTML = H(...MODES[m].title);
  const vis = m === "vision", ai = AI_KINDS.has(m), convo = m === "convo";
  const pair = convo || (m === "speech" && $("autoTurn").checked);
  $("langbar").classList.toggle("a-b", pair);
  show("tgtBox", !ai); show("swap", !ai);
  $("srcLabel").textContent = pair ? T("藍色（你）說", "Blue (you) speak")
    : ai ? T("AI 用這個語言回答", "AI answers in") : m === "text" ? T("我的語言", "My language") : T("我說的語言", "I speak");
  $("tgtLabel").textContent = pair ? T("橘色（對方）說", "Orange (other person) speaks") : T("翻譯成", "Translate into");
  show("turns", m === "speech" && $("autoTurn").checked);
  show("captionRow", m === "speech" || convo);
  show("stage", vis);
  $("feedTitle").textContent = ai ? "📝 " + T("AI 回答紀錄（最新的在最上面）", "AI answers (newest first)") : "📝 " + T("翻譯紀錄（最新的在最上面）", "Translations (newest first)");
  // dock: one clear action per function
  show("dSpeech", m === "speech"); show("dConvo", convo); show("dAsk", ai); show("visionRow", vis);
  const typing = m === "text" || m === "compose" || m === "ask";
  show("dTyping", typing);
  $("dTyping").style.marginTop = (m === "ask" ? "10px" : typing ? "0" : "10px");
  $("textIn").placeholder = m === "compose" ? T("寫下想傳給朋友的話…", "Write what you want to send…")
    : vis ? T("打字問 AI（會連同畫面一起送出）", "Type a question (sent with the picture)")
    : m === "ask" ? T("打字問任何問題…", "Type any question…") : T("輸入要翻譯的文字…", "Type text to translate…");
  $("sendText").innerHTML = ai ? H("問", "Ask") : H("翻譯", "Translate");
  updateTalkLabels(); stopAsk();
}

// keep the page content clear of the fixed bottom dock
function fitDock() { document.body.style.paddingBottom = $("dock").hidden ? "0" : ($("dock").offsetHeight + 16) + "px"; }
new ResizeObserver(fitDock).observe($("dock"));

// ===================== speech recognition (continuous: 聽我說 / 兩個人對話) =====================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, activeSpeaker = null;
function startListening(speaker) {
  if (!SR) { showWarn(T("這個瀏覽器不能語音辨識。iPhone 請用 Safari，電腦請用 Chrome；或改用「打字翻譯」。", "This browser can't recognise speech. Use Safari on iPhone or Chrome on a computer, or try “Type to translate”.")); return; }
  unlockTts();
  activeSpeaker = speaker;
  rec = new SR();
  rec.lang = speaker === "B" ? $("tgtLang").value : $("srcLang").value;
  rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];

async function streamSSE(url, payload, onDelta, onEvent) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Invite-Code": inviteCode() }, body: JSON.stringify(payload) });
  if (!res.ok) {
    let msg = "HTTP " + res.status;
    try { msg = (await res.json()).message || msg; } catch {}
    if (res.status === 401 || res.status === 403 || res.status === 429) checkServer();
    throw new Error(srvMsg(msg));
  }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = (block.match(/^event: (.*)$/m) || [])[1];
      const data = JSON.parse((block.match(/^data: (.*)$/m) || [, "{}"])[1]);
      if (ev === "delta") onDelta(data.text);
      else if (ev === "error") throw new Error(srvMsg(data.message));
      else if (onEvent) onEvent(ev, data);
    }
  }
}

async function translate(seg) {

// ===================== text-to-speech =====================
let speaking = false, ttsUnlocked = false, current = null;
// While a translation is read aloud the microphone would hear it and translate it again,
// so live listening pauses during speech and resumes when the queue is empty.
let micPausedForTts = false;
function pauseMicForTts() {
  if (!listening || !rec || micPausedForTts) return;
  micPausedForTts = true; setInterim("");
  try { rec.abort(); } catch {}
  renderListening();
}
function resumeMicAfterTts() {
  if (!micPausedForTts) return;
  micPausedForTts = false;
  if (listening && rec) { try { rec.start(); } catch {} }
  renderListening();
}
function unlockTts() { // iOS only lets a page speak after a tap: speak a silent utterance on the first one
  if (ttsUnlocked || !("speechSynthesis" in window)) return;
  ttsUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch {}
}
function speak(text, lang, now) {
  if (!("speechSynthesis" in window) || !text) return;
  if (mode === "speech" || mode === "convo") pauseMicForTts();
  if (now) { current = null; speechSynthesis.cancel(); ttsQueue.length = 0; speaking = false; }
  ttsQueue.push([text, lang]); if (!speaking) nextTts();
}
function nextTts() {
  const item = ttsQueue.shift(); if (!item) { speaking = false; resumeMicAfterTts(); return; }
  speaking = true;
  const u = new SpeechSynthesisUtterance(item[0]); u.lang = item[1];
  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang === item[1]) || voices.find(v => v.lang.startsWith(item[1].split("-")[0]));
  if (voice) u.voice = voice;
  current = u;
  u.onend = u.onerror = () => { if (current === u) nextTts(); }; // ignore late events from cancelled utterances
  speechSynthesis.speak(u);
}

const frames = {};
let camStream = null, facing = store.get("facing", "environment"), stillImage = null;
function updateCamButton() { $("camBtn").innerHTML = camStream ? H("⏹ 關鏡頭", "Camera off") : H("📷 開鏡頭", "Camera on"); }
async function startCamera() {

  stopCamera();

  } catch (e) {
    showWarn(e.name === "NotAllowedError" ? T("相機被擋住了：請在瀏覽器允許使用相機。", "The camera is blocked: allow it in your browser.") : T("鏡頭打不開：", "Can't open the camera: ") + e.message);
    return false;
  }

  const v = $("cam"); show(v, true); v.srcObject = camStream; v.style.transform = facing === "user" ? "scaleX(-1)" : "";
  await v.play().catch(() => {});

}
function stopCamera() {

function scaleImage(src, maxSide, q) {
  const w = src.naturalWidth || src.videoWidth, h = src.naturalHeight || src.videoHeight;
  const k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
function grabFrame() { // the uploaded photo, or the current camera frame
  if (!camStream && stillImage) return stillImage;
  const v = $("cam"); if (!camStream || !v.videoWidth) return null;
  return { full: scaleImage(v, 1024, 0.72), thumb: scaleImage(v, 192, 0.6) };
}
$("uploadBtn").onclick = () => { unlockTts(); $("imgFile").click(); };
$("imgFile").onchange = async () => {

  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    stillImage = { full: scaleImage(img, 1568, 0.82), thumb: scaleImage(img, 192, 0.6) }; // menus/documents need detail
  } catch { showWarn(T("這張照片打不開，請換一張。", "That photo can't be opened, please try another.")); return; }
  finally { URL.revokeObjectURL(url); }
  stopCamera(); show("cam", false);
  $("still").src = stillImage.full; show("still", true); show("camOff", false);
  const q = $("textIn").value.trim(); $("textIn").value = "";

// ===================== AI answers: 問 AI (web search) and 拍給 AI 看 (camera + web search) =====================
async function askAI(question) {
  const vis = mode === "vision";
  let f = null;
  if (vis) {
    if (!camStream && !stillImage && !(await startCamera())) return;
    if (camStream && !$("cam").videoWidth) await new Promise(r => setTimeout(r, 400));
    f = grabFrame(); if (!f) { showWarn(T("鏡頭還沒準備好，請再按一次。", "The camera isn't ready yet, please tap again.")); return; }
  }
  if (!question && !vis) return;
  const lang = $("srcLang").value;
  const seg = { id: Date.now() + Math.random(), t: Date.now(), kind: mode, speaker: null, from: lang, to: lang,
    src: question || T("（請看一下畫面）", "(Take a look)"), q: question, tgt: "", state: "pending", thumb: f?.thumb };
  if (f) frames[seg.id] = f.full;
  segments.push(seg); renderCard(seg); runAI(seg);
}
async function runAI(seg) {
  const vis = seg.kind === "vision";
  const full = frames[seg.id];
  if (vis && !full) { seg.state = "error"; seg.err = T("這張畫面已經不在了，請重新拍一次。", "That picture is gone — please take it again."); updateCard(seg); return; }
  const history = segments.filter(s => s.kind === seg.kind && s.state === "done" && s !== seg).slice(-4).map(s => ({ question: s.q || "", answer: s.tgt }));
  seg.tgt = ""; seg.state = "pending"; seg.sources = []; seg.status = T("🤔 AI 正在想…", "🤔 Thinking…"); updateCard(seg);
  if (vis) camState(T("🤔 AI 正在看…", "🤔 Looking…"));
  const voice = $("voiceReply").checked;
  if (voice) { window.speechSynthesis?.cancel(); ttsQueue.length = 0; speaking = false; }
  let spoken = 0;
  const speakFinished = (final) => { // read each finished sentence aloud right away
    if (!voice) return;
    const rest = seg.tgt.slice(spoken);
    const m = final ? rest.length : Math.max(...["。", "！", "？", ".", "!", "?", "\n"].map(p => rest.lastIndexOf(p))) + 1;
    if (m > 0 && rest.slice(0, m).trim()) { speak(rest.slice(0, m).trim(), seg.to); spoken += m; }
  };
  const onEvent = (ev, data) => {
    if (ev === "status" && data.kind === "search") {
      seg.status = data.query ? T(`🔎 正在上網查：${data.query}`, `🔎 Searching the web: ${data.query}`) : T("🔎 正在上網查…", "🔎 Searching the web…");
      if (vis) camState(seg.status);
      updateCard(seg);
    } else if (ev === "sources") { seg.sources = data.items || []; updateCard(seg); }
  };
  const url = vis ? "/api/vision" : "/api/ask";
  const payload = vis
    ? { image: full.split(",")[1], media_type: "image/jpeg", question: seg.q || "", answer_lang: langName(seg.to), history }
    : { question: seg.q, answer_lang: langName(seg.to), history };
  try {
    await streamSSE(url, payload, (t) => { seg.tgt += t; seg.status = ""; updateCard(seg); speakFinished(false); }, onEvent);
    seg.state = "done"; speakFinished(true);
  } catch (e) { seg.state = "error"; seg.err = T("回答失敗：", "No answer: ") + e.message; }
  seg.status = ""; if (vis) camState(""); updateCard(seg); persist();
}

  };
  r.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") showWarn(T("麥克風被擋住了：請在瀏覽器允許使用麥克風。", "The microphone is blocked: allow it in your browser.")); };
  r.onend = () => { const q = (finalText || latest).trim(); const mine = askRec === r; stopAsk(); if (mine && q) askAI(q); };
  $("askBtn").className = "big rec"; $("askBtn").innerHTML = H("■ 正在聽…說完會自動送出", "Listening… sends when you stop");
  try { r.start(); } catch { stopAsk(); }
};
$("lookBtn").onclick = () => { unlockTts(); window.speechSynthesis?.cancel(); askAI(""); };

// ===================== fullscreen captions =====================
let capSize = store.get("capSize", 6);
document.documentElement.style.setProperty("--cap", capSize + "vh");
$("captionBtn").onclick = () => { $("caption").classList.add("on"); document.documentElement.requestFullscreen?.().catch(() => {});
  const last = segments.filter(visible).at(-1); if (last) { $("capSrc").textContent = last.src; $("capTgt").textContent = last.tgt; } };
function closeCaption() { $("caption").classList.remove("on"); if (document.fullscreenElement) document.exitFullscreen(); }
$("capClose").onclick = closeCaption;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeCaption(); closeSheet(); } });
for (const [id, d] of [["capMinus", -1], ["capPlus", 1]]) $(id).onclick = () => {
  capSize = Math.max(3, Math.min(14, capSize + d)); store.set("capSize", capSize);
  document.documentElement.style.setProperty("--cap", capSize + "vh");
};

// ===================== export / clear =====================
function download(name, text) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
$("exportTxt").onclick = () => download(`muoitu-${stamp()}.txt`, segments.map(s =>
  `[${new Date(s.t).toLocaleTimeString()}]${s.speaker ? " " + s.speaker : ""}\n${s.src}\n${s.tgt}\n` +
  (s.sources?.length ? s.sources.map(x => `- ${x.title}: ${x.url}`).join("\n") + "\n" : "")).join("\n"));
$("exportSrt").onclick = () => {
  const fmt = (ms) => { ms = Math.max(0, ms); const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")},${String(ms % 1000).padStart(3,"0")}`; };
  const subs = segments.filter(s => !AI_KINDS.has(s.kind)); const t0 = subs[0]?.t || 0;
  download(`muoitu-${stamp()}.srt`, subs.map((s, i) => {
    const start = s.t - t0, end = (subs[i + 1] ? subs[i + 1].t - t0 : start + 4000);
    return `${i + 1}\n${fmt(start)} --> ${fmt(Math.max(end - 100, start + 800))}\n${s.tgt}\n`;
  }).join("\n"));
};
$("clearBtn").onclick = () => { if (!confirm(T("確定要清除所有紀錄嗎？", "Clear all history?"))) return; segments.length = 0; persist(); renderFeed(); closeSheet(); toast(T("已清除", "Cleared")); };

// ===================== installable app (PWA) =====================
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; show("installItem", true); });
$("installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; show("installItem", false); };

applyI18n(); updateCamButton(); stopAsk();
$("capTgt").textContent = T("等待說話…", "Waiting for speech…");
checkServer();
route();
</script>
</body>
</html>
